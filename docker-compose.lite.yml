services:
  weknora:
    build:
      context: .
      dockerfile: Dockerfile.lite
    image: weknora-lite:0.8.3
    container_name: WeKnora-lite
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.lite
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
